interface:
  display_name: "Open Study"
  short_description: "把九个平台的视频和帖子整理成可检索的学习资料，供人和 agent 直接取用"
  icon_small: "./assets/open-study.svg"
  icon_large: "./assets/open-study.svg"
  brand_color: "#117941"
  default_prompt: "使用 $open-study 采集这个链接，并直接整理成学习要点。"

dependencies:
  tools:
    - type: "mcp"
      value: "open-study"
      description: "Open Study 云端多平台学习资料库"
      transport: "streamable_http"
      url: "https://study.faroapi.cn/mcp"

policy:
  allow_implicit_invocation: true
