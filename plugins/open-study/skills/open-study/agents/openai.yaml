interface:
  display_name: "Open Study"
  short_description: "查阅教程、案例与已有资料，帮助探索做法、比较方案、改善结果"
  icon_small: "./assets/open-study.svg"
  icon_large: "./assets/open-study.svg"
  brand_color: "#117941"
  default_prompt: "使用 $open-study 查找与当前任务有关的教程和案例，读取后帮我完成工作。"

dependencies:
  tools:
    - type: "mcp"
      value: "open-study"
      description: "Open Study 云端多平台学习资料库"
      transport: "streamable_http"
      url: "https://study.faroapi.cn/mcp"

policy:
  allow_implicit_invocation: true
